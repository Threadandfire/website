<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11100f"><title>Thread & Fire | Culture moves fast.</title><meta name="description" content="The internet, decoded. Culture, technology, business and the stories catching fire."><style>:root{--bg:#11100f;--surface:#1c1a18;--line:#37332e;--text:#f3eee6;--muted:#aaa39a;--accent:#ed6a3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}button,input{font:inherit}button{cursor:pointer}header{border-bottom:1px solid var(--line)}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 5%;font-size:11px;letter-spacing:2px;color:var(--muted);border-bottom:1px solid var(--line)}.brand{font-family:Georgia,serif;text-align:center;font-size:clamp(40px,8vw,92px);font-weight:bold;letter-spacing:-3px;padding:19px 0 10px}.brand b{color:var(--accent);font-weight:normal}.tag{text-align:center;font-size:11px;letter-spacing:4px;color:var(--muted);padding-bottom:22px}nav{display:flex;justify-content:center;gap:30px;border-top:1px solid var(--line);padding:16px;overflow:auto}nav button{background:none;border:0;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:1.5px;white-space:nowrap}nav button.active,nav button:hover{color:var(--accent)}main{max-width:1190px;margin:auto;padding:0 24px}.ad{border:1px dashed #5c5148;background:#171512;display:flex;align-items:center;justify-content:center;text-align:center;color:#746d66;letter-spacing:2px;font-size:10px;min-height:90px;margin:28px 0}.eyebrow{color:var(--accent);font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:bold}.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:32px;padding:25px 0 40px;border-bottom:1px solid var(--line)}.hero-art{height:360px;background:radial-gradient(ellipse at 75% 30%,#c75935,transparent 40%),radial-gradient(ellipse at 35% 80%,#6a2820,transparent 45%),linear-gradient(125deg,#2d1c1a,#11100f);position:relative;overflow:hidden}.hero-art:before{content:'T&F';position:absolute;inset:0;display:grid;place-items:center;font:italic bold 150px Georgia,serif;color:#f3eee614;transform:rotate(-15deg)}h1,h2,h3,p{margin-top:0}h1{font:normal clamp(36px,4.5vw,65px)/1.06 Georgia,serif;letter-spacing:-1.5px;margin:16px 0}h2{font:normal 34px Georgia,serif}h3{font:normal 26px/1.2 Georgia,serif}p{line-height:1.65;color:var(--muted)}.meta{font-size:11px;color:#938b82;letter-spacing:1px;text-transform:uppercase}.cta{background:var(--accent);color:#1c100c;border:0;padding:13px 19px;font-size:11px;letter-spacing:1px;font-weight:bold;text-transform:uppercase}.sectionhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);margin:37px 0 24px;padding-bottom:13px}.sectionhead h2{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.story{cursor:pointer;border-bottom:1px solid var(--line);padding-bottom:22px}.thumb{height:155px;background:linear-gradient(135deg,#40312b,#211c1a);margin-bottom:17px;display:flex;align-items:center;justify-content:center;color:#ffffff20;font:italic 80px Georgia,serif}.story:nth-child(3n+2) .thumb{background:linear-gradient(135deg,#313a39,#171e20)}.story:nth-child(3n+3) .thumb{background:linear-gradient(135deg,#46352c,#261917)}.story h3{margin:10px 0;font-size:23px}.story p{font-size:13px}.lower{display:grid;grid-template-columns:1fr 280px;gap:35px}.sidebar .ad{height:250px}.search{background:transparent;border:1px solid var(--line);padding:11px;color:var(--text);width:100%;margin-bottom:15px}.empty{padding:40px 0;color:var(--muted)}footer{margin-top:60px;border-top:1px solid var(--line);padding:32px 5%;display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.article{max-width:760px;margin:45px auto}.article h1{font-size:clamp(38px,6vw,68px)}.article p{font-size:17px}.back{background:none;color:var(--accent);border:0;margin-bottom:20px}.notice{border-left:3px solid var(--accent);background:var(--surface);padding:14px 18px;color:var(--muted);font-size:13px;margin:24px 0}@media(max-width:750px){.hero,.lower{grid-template-columns:1fr}.hero-art{height:220px}.grid{grid-template-columns:1fr 1fr}.brand{letter-spacing:-2px}nav{justify-content:flex-start;padding-left:5%}.sidebar{display:none}}@media(max-width:490px){.grid{grid-template-columns:1fr}.hero{gap:17px}.hero h1{font-size:43px}.top span:last-child{display:none}.thumb{height:180px}main{padding:0 18px}}
</style></head><body><header><div class="top"><span>INDEPENDENT CULTURE JOURNAL</span><span>THE INTERNET, DECODED.</span><span id="date"></span></div><div class="brand">THREAD <b>&</b> FIRE<span style="color:#ed6a3b">.</span></div><div class="tag">CULTURE MOVES FAST. WE KEEP UP.</div><nav id="nav"></nav></header><main><div class="ad">ADVERTISEMENT · LEADERBOARD 970 × 90</div><div id="content"></div></main><footer><span>© 2026 THREAD & FIRE</span><span>Independent by design · Ads coming soon</span></footer><script>
const stories=[{id:1,cat:'Internet',title:'Why the internet keeps turning strange sightings into global mysteries',desc:'A look at how unusual footage becomes a worldwide conversation in a matter of hours.',body:['A strange clip travels across social media. Within hours, speculation races ahead of what the footage can actually establish.','The interesting story is often not just the image itself, but how quickly communities build explanations around it. Source verification, original upload dates, and context matter.'],tag:'THE INTERNET IS TALKING',mark:'?',featured:true},{id:2,cat:'Culture',title:'The comeback of the personal blog, minus the oversharing',desc:'A quieter, more intentional corner of the internet is finding its audience.',body:['The personal blog is being reconsidered as an alternative to the endlessly scrolling feed.','For readers, independent publications offer a chance to follow ideas rather than algorithms.'],mark:'C'},{id:3,cat:'Technology',title:'When a platform goes dark, the whole internet notices',desc:'Why outages spread beyond their technical origins and into the public imagination.',body:['A major service interruption can ripple through workplaces, news feeds, and everyday routines.','Not every outage is evidence of an attack. Confirmed technical findings should be separated from speculation.'],mark:'T'},{id:4,cat:'Business',title:'The rise of the one-person digital publication',desc:'Small publishers are experimenting with lightweight tools and niche audiences.',body:['Publishing tools have reduced the technical barriers to starting a small editorial website.','Revenue, however, still depends on audience trust, consistent value, and distribution.'],mark:'B'},{id:5,cat:'World',title:'How to read a breaking story without getting swept up in it',desc:'A practical guide to dates, sources, and claims that outrun the evidence.',body:['Breaking news develops unevenly. Early reports are often incomplete and sometimes corrected.','Checking publication dates and comparing independent sources is a useful first step.'],mark:'W'},{id:6,cat:'Internet',title:'The seven-day news cycle is getting even shorter',desc:'The viral moment has become a moving target for digital publishers.',body:['Trends move quickly, but the explanations behind them can stay useful long after the initial spike.','That creates an opportunity for thoughtful context rather than recycled headlines.'],mark:'7'}];
const cats=['All','Culture','Internet','Technology','World','Business'];let category='All',query='',selected=null;document.getElementById('date').textContent=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}).toUpperCase();const el=document.getElementById('content');function nav(){document.getElementById('nav').innerHTML=cats.map(c=>`<button class="${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;selected=null;nav();render()})}function card(s){return `<div class="story" data-id="${s.id}"><div class="thumb">${s.mark}</div><div class="eyebrow">${s.cat}</div><h3>${s.title}</h3><p>${s.desc}</p><div class="meta">EDITORIAL SAMPLE · 3 MIN READ</div></div>`}function bind(){document.querySelectorAll('[data-id]').forEach(e=>e.onclick=()=>{selected=stories.find(s=>s.id==e.dataset.id);render();window.scrollTo(0,0)})}function render(){if(selected){el.innerHTML=`<article class="article"><button class="back" id="back">← Back to stories</button><div class="eyebrow">${selected.cat} / EXPLAINED</div><h1>${selected.title}</h1><div class="meta">THREAD & FIRE · SAMPLE EDITORIAL</div><div class="notice">Prototype content. These are illustrative articles, not live reporting or independently verified news.</div>${selected.body.map(p=>`<p>${p}</p>`).join('')}<div class="ad">ADVERTISEMENT · IN-ARTICLE</div><p>More context and sourced reporting will appear here when the publishing pipeline is connected.</p></article>`;document.getElementById('back').onclick=()=>{selected=null;render()};return}let shown=stories.filter(s=>(category==='All'||s.cat===category)&&(`${s.title} ${s.desc} ${s.cat}`.toLowerCase().includes(query.toLowerCase())));let lead=shown[0];el.innerHTML=`${category==='All'&&!query?`<div class="hero"><div class="hero-art"></div><div><div class="eyebrow">THE BIG CONVERSATION</div><h1>${stories[0].title}</h1><p>${stories[0].desc}</p><button class="cta" data-id="1">READ THE STORY ↗</button><div class="meta" style="margin-top:18px">INTERNET · EDITORIAL SAMPLE</div></div></div>`:''}<div class="sectionhead"><h2>${category==='All'?'The Latest':category}</h2><span class="meta">CURATED FOR THE CURIOUS</span></div><div class="lower"><section><input class="search" id="search" placeholder="Search stories…" value="${query.replace(/"/g,'&quot;')}"><div class="grid">${shown.map(card).join('')}</div>${shown.length?'':'<div class="empty">No stories match your search.</div>'}</section><aside class="sidebar"><div class="eyebrow">SPONSORSHIP</div><div class="ad">ADVERTISEMENT · 300 × 250</div><h3>Stay curious.</h3><p>Internet culture, decoded without the noise.</p><div class="ad">ADVERTISEMENT · 300 × 250</div></aside></div><div class="ad">ADVERTISEMENT · FOOTER BANNER</div>`;document.getElementById('search').oninput=e=>{let pos=e.target.selectionStart;query=e.target.value;render();let i=document.getElementById('search');i.focus();i.setSelectionRange(pos,pos)};bind()}nav();render();</script></body></html>

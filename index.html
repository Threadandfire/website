<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Thread & Fire | The internet, examined.</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap');
:root{color-scheme:dark;--bg:#0c0c0e;--panel:#17171a;--line:#333337;--text:#f7f4f0;--muted:#a7a4a2;--fire:#ff6048}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif}a{color:inherit;text-decoration:none}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1320px;margin:auto;padding:0 32px}.mast{border-bottom:1px solid var(--line)}.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:25px;padding-bottom:25px}.logo{font-size:27px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}.logo em{color:var(--fire);font-style:normal}.strap{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.nav{border-bottom:1px solid var(--line)}.nav .wrap{display:flex;align-items:center;gap:28px;overflow-x:auto;padding-top:15px;padding-bottom:15px}.nav button{background:none;border:0;color:#c6c3c1;font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap;padding:0}.nav button.active,.nav button:hover{color:var(--fire)}.eyebrow{color:var(--fire);font-weight:800;letter-spacing:2px;font-size:11px;text-transform:uppercase}.intro{padding-top:48px;padding-bottom:32px}.intro h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(42px,6vw,83px);font-weight:600;letter-spacing:-2.5px;line-height:1.08;margin:12px 0}.intro p{color:var(--muted);max-width:720px;line-height:1.7}.hero{display:grid;grid-template-columns:1.2fr 1fr;min-height:490px;background:#1c1b1d}.visual{background-size:cover;background-position:center;position:relative;min-height:260px}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,#0005)}.hero-copy{padding:clamp(28px,5vw,70px);display:flex;flex-direction:column;justify-content:center}.hero h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(35px,4.1vw,61px);line-height:1.12;letter-spacing:-1.3px;margin:20px 0}.summary{line-height:1.65;color:#c6c2c0}.meta{font-size:12px;color:var(--muted);margin-top:18px}.cta{margin-top:30px;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--fire)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:55px 0 22px;border-bottom:1px solid var(--line);padding-bottom:17px}.section-head h2{font-family:'Playfair Display',Georgia,serif;font-size:34px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}.story{display:flex;flex-direction:column;gap:10px}.story .visual{aspect-ratio:1.42;min-height:0;transition:filter .2s}.story:hover .visual{filter:brightness(1.15)}.story h3{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600;line-height:1.2;margin:5px 0}.story p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}.ad{border:1px solid #3d3b3b;color:#7f7c7b;letter-spacing:2px;font-size:10px;text-align:center;padding:28px;margin:45px 0}.footer{border-top:1px solid var(--line);margin-top:65px;padding:35px 0;color:var(--muted);font-size:12px}.footer .wrap{display:flex;justify-content:space-between;gap:20px}.article{max-width:820px;margin:0 auto;padding:65px 24px}.back{color:var(--fire);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.article h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(40px,6vw,76px);line-height:1.08;letter-spacing:-2px;font-weight:600;margin:16px 0 20px}.article .lead{font-size:20px;color:#ccc8c6;line-height:1.6}.article .visual{height:440px;margin:34px 0 8px}.credit{font-size:11px;color:var(--muted)}.article-body{font-size:17px;line-height:1.9;color:#dedad8}.article-body h2{font-family:'Playfair Display',Georgia,serif;color:white;font-size:30px}.note{border-left:3px solid var(--fire);padding:12px 20px;background:#1c1a1a;color:#c8c3c0;font-size:14px;line-height:1.6}.source{display:inline-block;color:var(--fire);font-weight:800;border-bottom:1px solid var(--fire);margin-top:15px}.empty{padding:50px 0;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .visual{min-height:330px}.stories{grid-template-columns:repeat(2,1fr)}.strap{display:none}}@media(max-width:540px){.wrap{padding-left:19px;padding-right:19px}.stories{grid-template-columns:1fr}.intro{padding-top:32px}.hero .visual{min-height:250px}.article .visual{height:260px}.footer .wrap{flex-direction:column}}
.editorial-visual{min-height:180px;background:radial-gradient(ellipse at 20% 20%,#864034 0%,#2b1c20 45%,#111114 95%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;gap:12px}.editorial-visual span{font-size:11px;text-transform:uppercase;letter-spacing:3px;color:#e4b6a9}.editorial-visual strong{font-size:clamp(23px,4vw,54px);letter-spacing:-1.3px;z-index:1}.editorial-visual em{color:var(--fire);font-style:normal}.story .editorial-visual{min-height:0}.story .editorial-visual strong{font-size:24px}.article-body a{color:var(--fire);text-decoration:underline;overflow-wrap:anywhere}.source-list li{margin-bottom:10px}</style></head><body><header class="mast"><div class="wrap"><a href="#" class="logo">THREAD <em>&</em> FIRE</a><span class="strap">Internet culture, under the microscope.</span></div></header><nav class="nav"><div class="wrap" id="nav"><button data-filter="All" class="active">The Latest</button><button data-filter="Culture">Culture</button><button data-filter="Technology">Technology</button><button data-filter="Food">Food</button><button data-filter="Lifestyle">Lifestyle</button><button data-filter="Archive">Archive</button></div></nav><main id="app"><div class="wrap intro"><h1>The internet, examined.</h1><p>Stories behind the scroll. A fresh perspective on the moments moving online culture.</p></div></main><footer class="footer"><div class="wrap"><span>THREAD & FIRE © 2026</span><span>Independent internet culture magazine</span></div></footer><script>
const $=s=>document.querySelector(s);
const db='https://zukrfvefqtfuwsoygysx.supabase.co';
const key='sb_publishable_le9NDP8ZVLCJF42DAWwK0g_wr62CrfB';
let posts=[],filter='All';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=value=>{try{const u=new URL(value);return u.protocol==='https:'&&!u.username&&!u.password?u.href:''}catch{return ''}};
const fmtDate=value=>new Date(value).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
const inArchive=p=>{const age=Date.now()-Date.parse(p.published_at);return Number.isFinite(age)&&age>=0&&age<7*86400000};
function visual(p){return '<div class="visual editorial-visual"><span>'+esc(p.category)+'</span><strong>THREAD <em>&amp;</em> FIRE</strong></div>'}
function card(p){return '<a class="story" href="#story/'+esc(p.slug)+'">'+visual(p)+'<div class="eyebrow">'+esc(p.category)+' · Editorial</div><h3>'+esc(p.headline)+'</h3><p>'+esc(p.excerpt)+'</p><div class="meta">'+esc(fmtDate(p.published_at))+' · Read story ↗</div></a>'}
function home(){const list=filter==='All'?posts:filter==='Archive'?posts.filter(inArchive):posts.filter(p=>p.category===filter);const hero=list[0];const heading=filter==='All'?'The internet, examined.':filter==='Archive'?'The archive.':filter+'.';const intro='<section class="intro"><div class="eyebrow">Thread &amp; Fire / Digital Edition</div><h1>'+esc(heading)+'</h1><p>Behind every viral moment, there’s a bigger conversation. We follow the stories behind the scroll.</p></section>';
if(!hero){$('#app').innerHTML='<div class="wrap">'+intro+'<div class="empty">No published stories in this section yet. Check back soon.</div></div>';return}
$('#app').innerHTML='<div class="wrap">'+intro+'<a href="#story/'+esc(hero.slug)+'" class="hero">'+visual(hero)+'<div class="hero-copy"><div class="eyebrow">The lead story · '+esc(hero.category)+'</div><h2>'+esc(hero.headline)+'</h2><p class="summary">'+esc(hero.excerpt)+'</p><div class="meta">'+esc(fmtDate(hero.published_at))+'</div><span class="cta">Explore the story →</span></div></a>'+(list.length>1?'<div class="section-head"><h2>Worth a closer look</h2><span>'+list.length+' stories</span></div><section class="stories">'+list.slice(1).map(card).join('')+'</section>':'')+'<div class="ad">ADVERTISEMENT · RESERVED SPACE</div></div>'}
function inlineLinks(text){let out='',offset=0;for(const m of String(text).matchAll(/\[([^\]\n]+)\]\((https:\/\/[^\s)]+)\)/g)){out+=esc(text.slice(offset,m.index));const url=safeUrl(m[2]);out+=url?'<a href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+esc(m[1])+'</a>':esc(m[0]);offset=m.index+m[0].length}return out+esc(text.slice(offset))}
function article(p){const body=String(p.body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(x=>'<p>'+inlineLinks(x.trim()).replace(/\n/g,'<br>')+'</p>').join('');const sources=(Array.isArray(p.sources)?p.sources:[]).filter(s=>safeUrl(s.url)).map(s=>'<li><a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.title||'Source')+' ↗</a></li>').join('');$('#app').innerHTML='<article class="article"><a class="back" href="#">← Back to the magazine</a><div class="eyebrow" style="margin-top:45px">'+esc(p.category)+' / Editorial</div><h1>'+esc(p.headline)+'</h1><p class="lead">'+esc(p.excerpt)+'</p><div class="meta">Thread &amp; Fire · '+esc(fmtDate(p.published_at))+'</div>'+visual(p)+'<div class="article-body">'+body+(sources?'<h2>Sources</h2><ul class="source-list">'+sources+'</ul>':'')+'</div></article>'}
function route(){const m=location.hash.match(/^#story\/([a-z0-9-]+)$/);if(m){const p=posts.find(x=>x.slug===m[1]);if(p)article(p);else $('#app').innerHTML='<div class="wrap empty"><p>This article is not available.</p><a class="back" href="#">← Back to the magazine</a></div>'}else home();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));location.hash='';home();window.scrollTo(0,0)});
window.addEventListener('hashchange',route);
async function load(){try{const r=await fetch(db+'/rest/v1/published_articles?select=slug,headline,excerpt,body,category,sources,published_at&order=published_at.desc&limit=100',{headers:{apikey:key,Accept:'application/json'},cache:'no-store',redirect:'error'});if(!r.ok)throw Error(r.status);const data=await r.json();if(!Array.isArray(data))throw Error('Invalid feed');posts=data.filter(p=>/^[a-z0-9-]+$/.test(p.slug));route()}catch{$('#app').innerHTML='<div class="wrap empty">The magazine is temporarily unavailable. Please check back shortly.</div>'}}
load();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Spool & Ember | The internet, examined.</title><style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap');
:root{color-scheme:dark;--bg:#0c0c0e;--panel:#17171a;--line:#333337;--text:#f7f4f0;--muted:#a7a4a2;--fire:#ff6048}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif}a{color:inherit;text-decoration:none}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1320px;margin:auto;padding:0 32px}.mast{border-bottom:1px solid var(--line)}.mast .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;padding-top:25px;padding-bottom:25px}.logo{font-size:27px;font-weight:800;letter-spacing:-1.5px;white-space:nowrap}.logo em{color:var(--fire);font-style:normal}.strap{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.nav{border-bottom:1px solid var(--line)}.nav .wrap{display:flex;align-items:center;gap:28px;overflow-x:auto;padding-top:15px;padding-bottom:15px}.nav button{background:none;border:0;color:#c6c3c1;font-size:12px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;white-space:nowrap;padding:0}.nav button.active,.nav button:hover{color:var(--fire)}.eyebrow{color:var(--fire);font-weight:800;letter-spacing:2px;font-size:11px;text-transform:uppercase}.intro{padding-top:48px;padding-bottom:32px}.intro h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(42px,6vw,83px);font-weight:600;letter-spacing:-2.5px;line-height:1.08;margin:12px 0}.intro p{color:var(--muted);max-width:720px;line-height:1.7}.hero{display:grid;grid-template-columns:1.2fr 1fr;min-height:490px;background:#1c1b1d}.visual{background-size:cover;background-position:center;position:relative;min-height:260px}.visual:after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,#0005)}.hero-copy{padding:clamp(28px,5vw,70px);display:flex;flex-direction:column;justify-content:center}.hero h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(35px,4.1vw,61px);line-height:1.12;letter-spacing:-1.3px;margin:20px 0}.summary{line-height:1.65;color:#c6c2c0}.meta{font-size:12px;color:var(--muted);margin-top:18px}.cta{margin-top:30px;display:inline-flex;align-items:center;gap:14px;font-weight:800;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--fire)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:55px 0 22px;border-bottom:1px solid var(--line);padding-bottom:17px}.section-head h2{font-family:'Playfair Display',Georgia,serif;font-size:34px;margin:0}.section-head span{font-size:12px;color:var(--muted)}.stories{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px}.story{display:flex;flex-direction:column;gap:10px}.story .visual{aspect-ratio:1.42;min-height:0;transition:filter .2s}.story:hover .visual{filter:brightness(1.15)}.story h3{font-family:'Playfair Display',Georgia,serif;font-size:26px;font-weight:600;line-height:1.2;margin:5px 0}.story p{color:var(--muted);font-size:14px;line-height:1.6;margin:0}.ad{border:1px solid #3d3b3b;color:#7f7c7b;letter-spacing:2px;font-size:10px;text-align:center;padding:28px;margin:45px 0}.footer{border-top:1px solid var(--line);margin-top:65px;padding:35px 0;color:var(--muted);font-size:12px}.footer .wrap{display:flex;justify-content:space-between;gap:20px}.article{max-width:820px;margin:0 auto;padding:65px 24px}.back{color:var(--fire);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.article h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(40px,6vw,76px);line-height:1.08;letter-spacing:-2px;font-weight:600;margin:16px 0 20px}.article .lead{font-size:20px;color:#ccc8c6;line-height:1.6}.article .visual{height:440px;margin:34px 0 8px}.credit{font-size:11px;color:var(--muted)}.article-body{font-size:17px;line-height:1.9;color:#dedad8}.article-body h2{font-family:'Playfair Display',Georgia,serif;color:white;font-size:30px}.note{border-left:3px solid var(--fire);padding:12px 20px;background:#1c1a1a;color:#c8c3c0;font-size:14px;line-height:1.6}.source{display:inline-block;color:var(--fire);font-weight:800;border-bottom:1px solid var(--fire);margin-top:15px}.empty{padding:50px 0;color:var(--muted)}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero .visual{min-height:330px}.stories{grid-template-columns:repeat(2,1fr)}.strap{display:none}}@media(max-width:540px){.wrap{padding-left:19px;padding-right:19px}.stories{grid-template-columns:1fr}.intro{padding-top:32px}.hero .visual{min-height:250px}.article .visual{height:260px}.footer .wrap{flex-direction:column}}
</style></head><body><header class="mast"><div class="wrap"><a href="#" class="logo">SPOOL <em>&</em> EMBER</a><span class="strap">Internet culture, under the microscope.</span></div></header><nav class="nav"><div class="wrap" id="nav"><button data-filter="All" class="active">The Latest</button><button data-filter="Culture">Culture</button><button data-filter="Technology">Technology</button><button data-filter="Food">Food</button><button data-filter="Lifestyle">Lifestyle</button><button data-filter="Archive">Archive</button></div></nav><main id="app"><div class="wrap intro"><h1>The internet, examined.</h1><p>Stories behind the scroll. A fresh perspective on the moments moving online culture.</p></div></main><footer class="footer"><div class="wrap"><span>SPOOL & EMBER © 2026</span><span>Independent trend discovery · Editorial prototype</span></div></footer><script>
const $=s=>document.querySelector(s);let posts=[],filter='All';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(n);const img=p=>`background-image:linear-gradient(120deg,#120d1080,#120d101a),url('${p.image}')`;function card(p){return `<a class="story" href="#story/${p.slug}"><div class="visual" style="${img(p)}"></div><div class="eyebrow">${esc(p.category)} · Trend brief</div><h3>${esc(p.headline)}</h3><p>${esc(p.excerpt)}</p><div class="meta">${fmt(p.views)} views on source post · Read story ↗</div></a>`}function home(){let list=filter==='All'||filter==='Archive'?posts:posts.filter(p=>p.category===filter);let hero=list[0];if(!hero){$('#app').innerHTML='<div class="wrap empty">No stories in this section yet.</div>';return}$('#app').innerHTML=`<div class="wrap"><section class="intro"><div class="eyebrow">Spool & Ember / Digital Edition</div><h1>${filter==='All'?'The internet, examined.':filter==='Archive'?'The archive.':esc(filter)+'.'}</h1><p>Behind every viral moment, there’s a bigger conversation. We follow the stories behind the scroll.</p></section><a href="#story/${hero.slug}" class="hero"><div class="visual" style="${img(hero)}"></div><div class="hero-copy"><div class="eyebrow">The lead story · ${esc(hero.category)}</div><h2>${esc(hero.headline)}</h2><p class="summary">${esc(hero.excerpt)}</p><div class="meta">Based on a public TikTok post · ${fmt(hero.views)} views</div><span class="cta">Explore the story →</span></div></a><div class="section-head"><h2>Worth a closer look</h2><span>${list.length} stories</span></div><section class="stories">${list.slice(1,7).map(card).join('')}</section><div class="ad">ADVERTISEMENT · RESERVED SPACE</div>${list.length>7?`<div class="section-head"><h2>More from the feed</h2></div><section class="stories">${list.slice(7).map(card).join('')}</section>`:''}</div>`}function article(p){$('#app').innerHTML=`<article class="article"><a class="back" href="#">← Back to the magazine</a><div class="eyebrow" style="margin-top:45px">${esc(p.category)} / Trend brief</div><h1>${esc(p.headline)}</h1><p class="lead">${esc(p.excerpt)}</p><div class="meta">Spool & Ember editorial preview · Source post: ${fmt(p.views)} views</div><div class="visual" style="${img(p)}"></div><div class="credit">Illustrative stock photography, not an image from the source video.</div><div class="article-body"><p>${esc(p.excerpt)} The original video was shared by ${esc(p.creator)} (@${esc(p.username)}), and has attracted approximately ${fmt(p.views)} views and ${fmt(p.likes)} likes according to the imported dataset.</p><h2>What sparked the conversation?</h2><p>The post's original caption reads: “${esc(p.description)}”</p><h2>What we know so far</h2><p>Our source dataset confirms that this public post was collected and provides engagement figures. It does not independently establish the accuracy of claims made in the video. Further reporting, corroboration and context are required before publishing a definitive news article.</p><div class="note"><strong>Editorial status:</strong> This is a working trend brief generated from imported source metadata, not a fully reported or fact-checked article.</div><a class="source" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">View original TikTok source ↗</a></div></article>`}function route(){let m=location.hash.match(/^#story\/(\d+)$/);if(m){let p=posts.find(x=>x.slug===m[1]);if(p)article(p);else home()}else home();window.scrollTo(0,0)}$('#nav').addEventListener('click',e=>{let b=e.target.closest('button[data-filter]');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));location.hash='';home();window.scrollTo(0,0)});window.addEventListener('hashchange',route);fetch('./feed.json').then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(data=>{posts=data;route()}).catch(()=>{$('#app').innerHTML='<div class="wrap empty">Could not load feed.json. Publish the folder to a static web host or run a local web server.</div>'});
</script></body></html>
